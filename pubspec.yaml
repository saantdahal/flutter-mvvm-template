name: mvvm_riverpod_gen
description: >-
  CLI that scaffolds Flutter projects and features following the MVVM pattern
  with Riverpod, driven by a customizable configuration.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.5.0

# `dart pub global activate --source path .` exposes this as `mvvm_gen`.
executables:
  mvvm_gen:

# Intentionally dependency-free: the generator only uses dart:io / dart:convert
# so it can be run (or compiled to a single executable) without a pub fetch.
